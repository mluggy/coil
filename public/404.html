<!doctype html>
<!-- Presence of this file disables Cloudflare Pages' SPA fallback for
     static-asset misses: a request for a hashed bundle from a previous
     deploy must return a real 404 (so the client-side reload guard fires),
     never index.html with a 200. Keep this page dependency-free — it must
     not reference any hashed asset. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>404 — Not Found</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0a0a0b; color: #fafaf9;
             display: grid; place-items: center; min-height: 100vh; margin: 0; }
      main { text-align: center; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page doesn't exist. <a href="/">Go to the homepage</a></p>
    </main>
  </body>
</html>
